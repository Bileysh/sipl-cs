name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Перевірка форматування
        run: dotnet format whitespace --folder --verify-no-changes

      - name: Збірка (попередження вважаються помилками)
        run: dotnet build -c Release

      - name: Тести і покриття >= 80%
        shell: bash
        run: dotnet test -c Release --no-build -p:CollectCoverage=true -p:Include="[Sipl.Core]*" -p:Threshold=80

      - name: Conformance-тести через окремий процес
        shell: bash
        run: |
          SIPL="dotnet src/Sipl.Cli/bin/Release/net8.0/sipl.dll"
          $SIPL conformance --impl "$SIPL"
